
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-labelledby="title desc">
  <title id="title">Abhay — Full-stack and DevOps Engineer</title>
  <desc id="desc">Developer banner featuring ValueDefine, LibraryLogix, and Failover.</desc>

  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#30363d"/>
    </pattern>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#102c2c"/>
      <stop offset="100%" stop-color="#292630"/>
    </linearGradient>
  </defs>

  <rect width="900" height="220" rx="18" fill="url(#background)"/>
  <rect width="900" height="220" rx="18" fill="url(#dots)"/>
  <rect x="1" y="1" width="898" height="218" rx="17" fill="none" stroke="#30363d"/>

  <text x="44" y="83"
        font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="54" font-weight="800" fill="#e6edf3">Abhay</text>

  <text x="44" y="122"
        font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="19" fill="#9da7b3">Full-stack and DevOps engineer. I build products end to end.</text>

  <!-- ValueDefine -->
  <g transform="translate(44 156)">
    <rect width="130" height="32" rx="16"
          fill="#17c3b2" fill-opacity=".10" stroke="#17c3b2" stroke-opacity=".65"/>
    <circle cx="16" cy="16" r="4" fill="#17c3b2"/>
    <text x="28" y="21"
          font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="14" font-weight="650" fill="#e6edf3">ValueDefine</text>
  </g>

  <!-- LibraryLogix -->
  <g transform="translate(182 156)">
    <rect width="154" height="32" rx="16"
          fill="#8b8cf9" fill-opacity=".10" stroke="#8b8cf9" stroke-opacity=".65"/>
    <circle cx="16" cy="16" r="4" fill="#8b8cf9"/>
    <text x="28" y="21"
          font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="14" font-weight="650" fill="#e6edf3">LibraryLogix</text>
  </g>

  <!-- Failover -->
  <g transform="translate(344 156)">
    <rect width="110" height="32" rx="16"
          fill="#f5c518" fill-opacity=".10" stroke="#f5c518" stroke-opacity=".65"/>
    <circle cx="16" cy="16" r="4" fill="#f5c518"/>
    <text x="28" y="21"
          font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="14" font-weight="650" fill="#e6edf3">Failover</text>
  </g>
</svg>
